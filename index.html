<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şevki Kağan Ay | Uzm.Demokrat</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg: #000; --accent: #ff3c3c; --accent2: #ff8c00; }

html, body {
  background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  scrollbar-width: none; 
  -ms-overflow-style: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

#site_content_scroller {
  width: 100vw;
  height: 100vh;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
#site_content_scroller::-webkit-scrollbar { display: none; }

.horizontal-track { display: flex; width: max-content; height: 100vh; }
.slide { width: 100vw; height: 100vh; flex-shrink: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

/* HERO (GİRİŞ) */
#slide-hero { background: radial-gradient(circle at center, #110303 0%, #000 70%); }
.hero-eyebrow { font-family:'Barlow Condensed', sans-serif; font-size: clamp(12px, 1.5vw, 16px); letter-spacing: 0.5em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }
.hero-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(60px, 14vw, 180px); line-height: 0.9; text-align: center; letter-spacing: 2px; }
.hero-sub { margin-top: 24px; font-family:'Barlow Condensed', sans-serif; font-size: clamp(16px, 2vw, 22px); color: rgba(255,255,255,0.7); text-align: center; max-width: 600px; }
.hero-sub em { color: var(--accent2); font-style:normal; font-weight:700; }
.scroll-hint { position: absolute; bottom: 32px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; animation: pulse 2s infinite; }
.scroll-line { width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--accent), transparent); }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* VİDEOLAR */
.vid-card { background: #000; }
.vid-card video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.vid-overlay { position: absolute; bottom: 40px; left: 40px; z-index: 10; pointer-events: none; }
.vid-num { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: rgba(255,255,255,0.3); }
.vid-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); margin-top: 4px; }

/* 1. DÜZENLİ FOTOĞRAF GALERİSİ */
#slide-photos { background: #000; padding: 40px; }
.photos-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 24px; }
.photos-label { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
.photos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.photo-frame { position: relative; overflow: hidden; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); cursor: zoom-in; aspect-ratio: 4/5; }
.photo-frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.photo-frame:hover img { transform: scale(1.03); }

/* 2. DAĞINIK FOTOĞRAF KOLAJI */
#slide-scattered { background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%); }
.scatter-container { width: 100vw; height: 100vh; position: relative; }
.scatter-img { position: absolute; width: clamp(120px, 18vw, 250px); border: 6px solid #fff; border-bottom-width: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: zoom-in; z-index: 5; background: #fff; }
.scatter-img:hover { transform: scale(1.3) rotate(0deg) !important; z-index: 100; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
.scatter-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 8vw, 100px); color: rgba(255,255,255,0.05); z-index: 0; pointer-events: none; white-space: nowrap; }

/* 3. ÇERÇEVESİZ SIRALI GALERİ */
#slide-frameless { width: max-content !important; padding: 0 5vw; background: #000; }
.frameless-track { display: flex; flex-direction: row; gap: 30px; height: 100vh; align-items: center; }
.frameless-track img { height: 60vh; max-width: 80vw; object-fit: contain; cursor: zoom-in; transition: transform 0.4s ease; filter: drop-shadow(0 10px 20px rgba(255,255,255,0.05)); }
.frameless-track img:hover { transform: scale(1.05); z-index: 10; }

/* 4. BÜYÜK FİNAL & SÜRPRİZ EKRANI */
#slide-finale { background: #000; position: relative; justify-content: center; }
.finale-desc { color: var(--accent2); letter-spacing: 4px; text-transform: uppercase; font-size: clamp(14px, 2.5vw, 22px); font-weight: 700; z-index: 20; text-align: center; margin-bottom: 1vh; }
.finale-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(60px, 12vw, 140px); color: #fff; z-index: 20; text-align: center; line-height: 1; }
.finale-title span { color: var(--accent); }

/* YENİ: CS Altyazı Stili */
.finale-sub-text { font-family: 'Bebas Neue', sans-serif; font-size: clamp(28px, 6vw, 65px); color: var(--accent2); z-index: 20; text-align: center; margin-top: 10px; letter-spacing: 2px; line-height: 1; }

#balloons-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 30; }
.balloon-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; pointer-events: auto; cursor: crosshair; transition: opacity 0.2s, transform 0.2s; animation: floatBalloon 3s ease-in-out infinite alternate; }
.balloon-wrapper.popped { transform: scale(0) !important; opacity: 0; pointer-events: none; }
.balloon-emoji { font-size: clamp(80px, 10vw, 140px); user-select: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); z-index: 2; }

/* DÜZELTİLMEDİ: İp yüksekliği 100vh'den 120px'e çekildi, böylece balonlar ekrana sığdı */
.balloon-string { width: 2px; height: 120px; background: linear-gradient(to bottom, rgba(255,255,255,0.7), transparent); margin-top: -10px; z-index: 1; }
@keyframes floatBalloon { 0% { transform: translateY(0) rotate(-2deg); } 100% { transform: translateY(-25px) rotate(2deg); } }

/* Sürpriz Fotoğraf */
#surprise-photo { position: absolute; bottom: -100%; left: 50%; transform: translateX(-50%); height: 65vh; max-width: 90vw; object-fit: contain; z-index: 10; transition: bottom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0px 10px 30px rgba(255, 60, 60, 0.5)); }
#surprise-photo.revealed { bottom: 5vh; }

/* LIGHTBOX & HEADER */
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; align-items: center; justify-content: center; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; }
#lightbox-close { position: absolute; top: 24px; right: 24px; font-size: 32px; color: #fff; background: none; border: none; cursor: pointer; }

#sticky-header { position: fixed; top: 0; left: 0; right: 0; z-index: 500; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; transform: translateY(-100%); transition: transform 0.3s ease; }
#sticky-header.visible { transform: translateY(0); }
.sticky-name { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; }
.sticky-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.2em; color: var(--accent2); text-transform: uppercase; }
</style>
</head>
<body>

<audio id="pop-audio" src="media/u_jspnqv1glx-1gift-confetti-447240.mp3" preload="auto"></audio>

<header id="sticky-header">
  <span class="sticky-name">ŞEVKİ KAĞAN AY</span>
  <span class="sticky-tag">17 Y.O. LEGEND</span>
</header>

<div id="site_content_scroller">
  <div class="horizontal-track" id="horizontal-track">

    <section class="slide" id="slide-hero">
      <div class="hero-eyebrow">⚡ Young Talent ⚡</div>
      <h1 class="hero-name">ŞEVKİ KAĞAN AY</h1>
      <p class="hero-sub"><em>17 y.o. young talent</em> — XANTARES'i aratmayan vuruşlar.</p>
      <div class="scroll-hint"><span>Aşağı Doğru Kaydır</span><div class="scroll-line"></div></div>
    </section>

    <section class="slide" id="slide-photos">
      <div class="photos-container">
        <div class="photos-header"><span class="photos-label">◈ Galeri</span></div>
        <div class="photos-grid" id="photos-grid"></div>
      </div>
    </section>

    <section class="slide" id="slide-scattered">
      <div class="scatter-title">UNUTULMAZ ANLAR</div>
      <div class="scatter-container" id="scatter-container"></div>
    </section>

    <section class="slide" id="slide-frameless">
      <div class="frameless-track" id="frameless-track"></div>
    </section>

    <section class="slide" id="slide-finale">
      <p class="finale-desc" id="finale-desc">SÜPRİZİ GÖRMEK İÇİN BALONLARI PATLAT!</p>
      <h1 class="finale-title" id="finale-text">İYİ Kİ <span>DOĞDUN!</span></h1>
      <p class="finale-sub-text" id="finale-sub-text">BOL CS'Lİ YILLARA! 🎮</p>
      
      <img id="surprise-photo" src="https://github.com/uzmdrufukkarbas/damargenisletensite/blob/main/media/last.png?raw=true" alt="Sürpriz!">
      <div id="balloons-container"></div>
    </section>

  </div>
</div>

<div id="lightbox">
  <button id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
(function(){
  const VIDEO_SRCS = [
    "media/RUID02905e1cf5c04117ae86ad67e628c91f.mp4", "media/RUID09d1c1c249e045288eebda8806b3d85d.mp4",
    "media/RUID2a6f48bca79e48a282949bf494150553.mp4", "media/RUID31ce228c13a74825ae7ef64e51c25737.mp4",
    "media/RUID48aa60807f0c47ab930fc7befa0a06a1.mp4", "media/RUID50b9f67568a744e98f245f84728c3b4e.mp4",
    "media/RUID850d4ab8a12e458487aefaca5a5ca4f6.mp4", "media/RUID8545ade1b073494485f98a1a25c059e8.mp4",
    "media/RUID86d803d5256e4feeb3fe78f131bcef14.mp4", "media/RUID92c008203b2c4001ba77b98319b73c70.mp4",
    "media/RUIDb79ca77a9dfb40bf93bb43fd1a41bd81.mp4", "media/RUIDbacb6b537e724f7193f91fec15d02ccb.mp4",
    "media/RUIDc13b4218389d4df194aeaa4c346c2301.mp4", "media/RUIDda313186f52c40f08ee69efd39c7198d.mp4",
    "media/RUIDee1b9d8351a6416ba3920ad65056f996.mp4"
  ];

  const PHOTO_SRCS = [
    "media/%E2%80%8EOnurhan%20Karba%C5%9F%20ki%C5%9Fisinden%20foto%C4%9Fraf(1).jpg",
    "media/%E2%80%8EOnurhan%20Karba%C5%9F%20ki%C5%9Fisinden%20foto%C4%9Fraf.jpg"
  ];

  const SCATTERED_SRCS = [
    "media/1737306616931.png", "media/1737306692674.png", "media/1737307303438.png",
    "media/1737307917689.png", "media/1737308386444.png", "media/1772973296985.png",
    "media/1773003459822.png", "media/1773093550254.png", "media/1773093756004.png",
    "media/1773095865360.png", "media/1773096375779.png", "media/1773613353897.png",
    "media/file_00000000a7907246a3549a90cea631f6.png"
  ];

  const FRAMELESS_SRCS = [
    "media/RUIDf0220d8c07fc407d948cdd77bc50e4d9.png", "media/RUIDcd980da663fc4edf86eee4a948a23a75.png",
    "media/RUIDe06d0b343f914a8ba5135c9f99ad72fa.png", "media/RUIDe49a6b5428f14ceea8ce329eca79320a.png",
    "media/RUID16ea38f487c34bdb9219b339aa372f72.png", "media/RUID4e95442019b24926b99b50679e896c98.png",
    "media/RUID6c182593b32a4480ae31ab2a8603d167.png", "media/RUID713ddf0d6596421194218de5e4c068e9.png",
    "media/RUID873145abc0de42f48ddd74c3766c93a2.png", "media/RUID73688be446084e9cbb4cb39aa8d01b25.png",
    "media/RUID903739d0758541daa061daa311af8440.png", "media/RUID90a2b0beb5134336b9eecda936571281.png",
    "media/RUID963dded2635a4e02b7e78301ed9d9b4f.png", "media/RUIDbbeefb0f08e5453fb365748c16b90988.png"
  ];

  let allVidEls = [];
  const scroller = document.getElementById('site_content_scroller');
  const track = document.getElementById('horizontal-track');
  const photosSlide = document.getElementById('slide-photos');
  
  VIDEO_SRCS.forEach((src, i) => {
    const section = document.createElement('section');
    section.className = 'slide vid-card';
    const vid = document.createElement('video');
    vid.muted = true; vid.autoplay = false;
    vid.setAttribute('muted', ''); vid.setAttribute('playsinline', '');
    vid.preload = 'auto'; vid.loop = true; vid.src = src; 
    
    const overlay = document.createElement('div');
    overlay.className = 'vid-overlay';
    overlay.innerHTML = `<div class="vid-num">${String(i + 1).padStart(2, '0')}</div><div class="vid-label">Highlight Clip</div>`;
    
    section.appendChild(vid); section.appendChild(overlay);
    track.insertBefore(section, photosSlide);
    allVidEls.push(vid);
  });

  scroller.addEventListener('wheel', (e) => {
    if (e.deltaY !== 0) { e.preventDefault(); scroller.scrollLeft += e.deltaY; }
  }, { passive: false });

  function initVideos() {
    allVidEls.forEach(vid => { if(vid.paused) { vid.play().then(() => vid.pause()).catch(() => {}); }});
    window.removeEventListener('click', initVideos);
  }
  window.addEventListener('click', initVideos);

  scroller.addEventListener('scroll', () => {
    const scrolledX = scroller.scrollLeft;
    const viewWidth = window.innerWidth;
    const activeIndex = Math.round(scrolledX / viewWidth);
    
    allVidEls.forEach((vid, i) => {
      if (activeIndex === (i + 1)) { if (vid.paused) { vid.play().catch(() => {}); } } 
      else { vid.pause(); }
    });

    const sh = document.getElementById('sticky-header');
    if (scrolledX > viewWidth * 0.3) { sh.classList.add('visible'); } 
    else { sh.classList.remove('visible'); }
  }, { passive: true });

  // 1. İLK GALERİ
  const grid = document.getElementById('photos-grid');
  PHOTO_SRCS.forEach(src => {
    const frame = document.createElement('div'); frame.className = 'photo-frame';
    const img = document.createElement('img'); img.src = src;
    frame.appendChild(img);
    frame.addEventListener('click', () => openLightbox(src));
    grid.appendChild(frame);
  });

  // 2. DAĞINIK KOLAJ
  const scatterContainer = document.getElementById('scatter-container');
  SCATTERED_SRCS.forEach((src) => {
    const img = document.createElement('img'); img.src = src; img.className = 'scatter-img';
    const top = 10 + Math.random() * 60; 
    const left = 5 + Math.random() * 75; 
    const rotate = -35 + Math.random() * 70; 
    img.style.top = `${top}%`; img.style.left = `${left}%`; img.style.transform = `rotate(${rotate}deg)`;
    img.addEventListener('click', () => openLightbox(src));
    scatterContainer.appendChild(img);
  });

  // 3. ÇERÇEVESİZ GALERİ
  const framelessTrack = document.getElementById('frameless-track');
  FRAMELESS_SRCS.forEach((src) => {
    const img = document.createElement('img');
    img.src = src;
    img.addEventListener('click', () => openLightbox(src));
    framelessTrack.appendChild(img);
  });

  // 4. BALON SİSTEMİ & KONFETİ LOOP
  const bContainer = document.getElementById('balloons-container');
  const popAudio = document.getElementById('pop-audio');
  const surprisePhoto = document.getElementById('surprise-photo');
  const finaleText = document.getElementById('finale-text');
  const finaleSubText = document.getElementById('finale-sub-text');
  const finaleDesc = document.getElementById('finale-desc');
  let poppedCount = 0;
  const TOTAL_BALLOONS = 17;

  let isConfettiLooping = false;
  function startConfettiLoop() {
    if (isConfettiLooping) return;
    isConfettiLooping = true;
    
    function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: ['#ff3c3c', '#ff8c00', '#00cfff', '#ffffff', '#ffd700'], zIndex: 9999 });
      confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: ['#ff3c3c', '#ff8c00', '#00cfff', '#ffffff', '#ffd700'], zIndex: 9999 });
      if (isConfettiLooping) { requestAnimationFrame(frame); }
    }
    frame();
  }

  for(let i = 0; i < TOTAL_BALLOONS; i++) {
    const b = document.createElement('div');
    b.className = 'balloon-wrapper';
    
    // Balon dağılımları sağa ve sola ayarlandı (Merkez açık bırakıldı)
    const isLeft = i % 2 === 0;
    const horizontalPos = isLeft ? (2 + Math.random() * 22) : (74 + Math.random() * 22);
    b.style.left = `${horizontalPos}%`;
    
    // Yeni ip yüksekliğine göre dikey hizalama
    const bottomPos = 10 + Math.random() * 55; 
    b.style.bottom = `${bottomPos}%`;
    b.style.animationDelay = `${Math.random() * 2}s`;
    
    b.innerHTML = `<div class="balloon-emoji">🎈</div><div class="balloon-string"></div>`;
    
    b.addEventListener('click', () => {
      if(b.classList.contains('popped')) return;
      
      popAudio.currentTime = 0; 
      popAudio.play().catch(()=>{});
      
      b.classList.add('popped');
      poppedCount++;
      
      if(poppedCount === TOTAL_BALLOONS) {
        finaleText.style.display = 'none';
        if(finaleSubText) finaleSubText.style.display = 'none'; // Yeni eklenen CS yazısı gizlenir
        finaleDesc.style.display = 'none';
        surprisePhoto.classList.add('revealed');
        startConfettiLoop();
      }
    });
    bContainer.appendChild(b);
  }

  // LIGHTBOX
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');
  document.getElementById('lightbox-close').addEventListener('click', closeLb);
  lb.addEventListener('click', e => { if(e.target===lb) closeLb(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeLb(); });
  function openLightbox(src) { lbImg.src = src; lb.classList.add('open'); }
  function closeLb() { lb.classList.remove('open'); }

})();
</script>
</body>
</html>
